version: '3.8'

services:
  # 1. The Frontend (Next.js) - NEW addition for the monorepo
  frontend:
    build:
      context: ./frontend
      # Assumes you made a Dockerfile.dev as discussed, or just 'Dockerfile'
      dockerfile: Dockerfile.dev 
    command: npm run dev
    tty: true                # allocate pseudo-TTY for nicer logs
    stdin_open: true         # keep stdin open (prevents container exit)
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevents local node modules from breaking the Linux container
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

  # 2. The Web Server (FastAPI)
  backend:
    build: 
      context: ./backend
    command: /bin/bash ./scripts/start.sh
    volumes:
      - ./backend:/app  # Syncs your code live (Hot Reload works!)
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - redis

  # 3. The Background Worker (Celery)
  # Uses the SAME Dockerfile as backend, but runs a different command
  worker:
    build: 
      context: ./backend
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - redis

  # 4. The Database (PostgreSQL) - Ready for when you need it
  # db:
  #   image: postgres:15-alpine
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   environment:
  #     - POSTGRES_USER=verijust_user
  #     - POSTGRES_PASSWORD=verijust_pass
  #     - POSTGRES_DB=verijust_db
  #   ports:
  #     - "5432:5432"

  # 5. The Message Broker (Redis)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

